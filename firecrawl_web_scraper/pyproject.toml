[tool.poetry]
name = "firecrawl-web-scraper"
version = "0.1.0"
description = "Standalone Firecrawl-powered web search helper for xFloor fallback retrieval."
authors = ["OpenAI Codex <codex@openai.com>"]
readme = "README.md"
packages = [{ include = "firecrawl_web_scraper" }]

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
